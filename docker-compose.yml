services:
  # 1. MariaDB: 데이터 저장소
  db:
    image: mariadb:10.6
    container_name: chatbot-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ./mariadb_data:/var/lib/mysql # 컨테이너 삭제 후에도 데이터 유지
    networks:
      - chatbot-net

  # 2. FastAPI: LLM 가공 및 중계 (Ollama 연동)
  llm-api:
    build: ./backend-python
    container_name: fastapi-app
    restart: always
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # WSL2 호스트의 Ollama 접속 허용
    environment:
      - OLLAMA_HOST=host.docker.internal
      - OLLAMA_PORT=11434
    networks:
      - chatbot-net

  # 3. Spring Boot: 메인 로직 및 JSP UI
  java-app:
    build: ./backend-java
    container_name: spring-app
    restart: always
    ports:
      - "8087:8087"
    depends_on:
      - db
      - llm-api
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD}
      - FASTAPI_URL=http://llm-api:8000
    networks:
      - chatbot-net

networks:
  chatbot-net:
    driver: bridge